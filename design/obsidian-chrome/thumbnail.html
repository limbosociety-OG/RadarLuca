<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;position:relative;background:var(--field-corner);display:flex;align-items:center;justify-content:center}
.seal{position:relative;width:430px;height:430px;border:1px solid rgba(242,241,239,.8);border-radius:50%;display:flex;align-items:center;justify-content:center}
.seal i{position:absolute;inset:14px;border:1px solid rgba(242,241,239,.34);border-radius:50%}
.mono{font-family:var(--face-ring);font-weight:400;font-size:150px;line-height:.9;letter-spacing:.04em;color:#F2F1EF;text-align:center}
.strip{width:214px;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head><body>
<div class="main"><div class="seal"><i></i><div class="mono">LM</div></div></div>
<div class="strip"><div style="background:#E5E4E2"></div><div style="background:#8E9FAA"></div><div style="background:#536878"></div><div style="background:#1C2E3D"></div></div>
</body></html>
