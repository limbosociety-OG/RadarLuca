<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
__FONTFACE__

/* ============================================================
   Obsidian Chrome — sistema travado em 10.09.2026.
   Fonte da verdade: design/obsidian-chrome/ (tokens/, CLAUDE.md).
   Os tokens abaixo são cópia literal de lá; mudou lá, muda aqui.
   ============================================================ */
:root{
  /* paleta */
  --onyx:#0A0A0A; --blue-slate:#536878; --alabaster:#E5E4E2;
  --chrome-3:#536878; --chrome-5:#8E9FAA; --chrome-6:#B4C0C7; --chrome-7:#D2D9DC;
  --ink-full:#F2F1EF; --ink-high:#E5E4E2;
  --ink-mid:rgba(229,228,226,0.66); --ink-low:rgba(229,228,226,0.44);
  --ink-onyx:#0A0A0A; --ink-onyx-mid:rgba(10,10,10,0.62); --ink-onyx-low:rgba(10,10,10,0.44);
  --rule-faint:rgba(229,228,226,0.13); --rule:rgba(229,228,226,0.24);
  --rule-strong:rgba(229,228,226,0.42); --rule-onyx:rgba(10,10,10,0.20);
  --rule-onyx-strong:rgba(10,10,10,0.42);

  /* campos de luz — todo fundo sai daqui */
  --field-blob:radial-gradient(118% 86% at 50% 104%,#F2F1EF 0%,#D2D9DC 12%,#8E9FAA 30%,#536878 50%,#1C2E3D 74%,#0A0A0A 100%);
  --field-wash:linear-gradient(180deg,#0A0A0A 0%,#0C121A 34%,#3C5567 62%,#8E9FAA 82%,#0C121A 100%);
  --field-cone:radial-gradient(74% 120% at 0% 50%,#E8F0F6 0%,rgba(142,159,170,0.55) 10%,rgba(60,85,103,0.35) 26%,rgba(12,18,26,0.96) 58%,#0A0A0A 100%);
  --field-corner:radial-gradient(128% 96% at 4% -8%,#D2D9DC 0%,#8E9FAA 12%,#3C5567 32%,#111A25 62%,#0A0A0A 100%);
  --field-sky:linear-gradient(178deg,#7C93A6 0%,#41596B 42%,#1E2C38 78%,#0A0A0A 100%);
  --field-horizon:radial-gradient(80% 60% at 50% 96%,#B4C0C7 0%,#536878 22%,#16232F 52%,#0A0A0A 100%);
  --field-onyx:#0A0A0A;
  --field-slab:linear-gradient(158deg,#16232F 0%,#0C121A 64%,#0A0A0A 100%);
  --field-paper:linear-gradient(180deg,#F2F1EF 0%,#E5E4E2 100%);
  --veil-bottom:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,0.55) 46%,rgba(10,10,10,0.92) 100%);
  --veil-top:linear-gradient(0deg,rgba(10,10,10,0) 0%,rgba(10,10,10,0.62) 76%,rgba(10,10,10,0.88) 100%);
  --veil-left:linear-gradient(90deg,rgba(10,10,10,0.9) 0%,rgba(10,10,10,0.4) 52%,rgba(10,10,10,0) 100%);
  --rule-bleed:linear-gradient(90deg,rgba(229,228,226,0) 0%,rgba(229,228,226,0.30) 14%,rgba(229,228,226,0.30) 86%,rgba(229,228,226,0) 100%);
  --rule-bleed-onyx:linear-gradient(90deg,rgba(10,10,10,0) 0%,rgba(10,10,10,0.22) 14%,rgba(10,10,10,0.22) 86%,rgba(10,10,10,0) 100%);

  /* tipografia */
  --face-display:"Jost","Futura",sans-serif;
  --face-spec:"Poppins","Jost",sans-serif;
  --face-text:"Archivo","Helvetica Neue",sans-serif;
  --face-ring:"Cormorant Garamond",Didot,serif;

  --pad:76px; --gutter:10px; --tick:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050607}

/* ---------- a placa ---------- */
.slide{
  position:relative; width:1080px; height:1350px; overflow:hidden; isolation:isolate;
  padding:var(--pad); display:flex; flex-direction:column;
  font-family:var(--face-text); font-weight:400; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  color:var(--ink-full);
}
.slide>.veu{position:absolute; inset:0; pointer-events:none; z-index:0}
.slide>*:not(.veu){position:relative; z-index:1}

.campo-blob{background:var(--field-blob)}   .campo-wash{background:var(--field-wash)}
.campo-cone{background:var(--field-cone)}   .campo-corner{background:var(--field-corner)}
.campo-sky{background:var(--field-sky)}     .campo-horizon{background:var(--field-horizon)}
.campo-onyx{background:var(--field-onyx)}   .campo-slab{background:var(--field-slab)}
.campo-paper{background:var(--field-paper); color:var(--ink-onyx)}
.veu-bottom{background:var(--veil-bottom)} .veu-top{background:var(--veil-top)}
.veu-left{background:var(--veil-left)}

/* tinta por fundo: o papel é o único campo claro */
.slide{--t1:var(--ink-full); --t2:var(--ink-mid); --t3:var(--ink-low);
       --r1:var(--rule); --r2:var(--rule-strong); --rb:var(--rule-bleed)}
.slide.campo-paper{--t1:var(--ink-onyx); --t2:var(--ink-onyx-mid); --t3:var(--ink-onyx-low);
       --r1:var(--rule-onyx); --r2:var(--rule-onyx-strong); --rb:var(--rule-bleed-onyx)}

/* ---------- versalete: rótulo · régua · número ---------- */
.caps{font-family:var(--face-spec); font-weight:500; font-size:17px; letter-spacing:.2em;
      text-transform:uppercase; line-height:1.24}
.linha{display:flex; align-items:baseline; gap:16px}
.linha .esq{color:var(--t2); white-space:nowrap}
.linha .dir{color:var(--t1); white-space:nowrap}
.linha .regua-f{flex:1; height:1px; background:var(--r1); align-self:center}

/* ---------- miolo ---------- */
.miolo{flex:1; display:flex; flex-direction:column; justify-content:flex-start;
       padding:48px 0 40px; min-height:0}
.miolo.centro{justify-content:center}
.miolo.base{justify-content:flex-end}
.bloco+.bloco{margin-top:32px}

.kicker{color:var(--t2); margin-bottom:4px}

h1{font-family:var(--face-display); font-weight:300; font-size:68px; line-height:1.1;
   letter-spacing:-.015em; color:var(--t1); max-width:880px; text-wrap:balance}
h1.curta{font-weight:200; font-size:92px; line-height:1.05}
.capa h1{font-weight:200; font-size:112px; line-height:.98; letter-spacing:-.02em}
.fecho h1{font-weight:200; font-size:92px; line-height:1.05}

.filete{width:96px; height:1px; background:var(--r2); margin:36px 0 4px}
.regua{height:1px; background:var(--rb); margin:8px 0}

p.corpo{font-size:27px; line-height:1.5; color:var(--t2); max-width:880px; text-wrap:pretty}
.capa p.corpo, .fecho p.corpo{font-size:32px; max-width:760px}
p.corpo b, .caixa p b, .item p b, .duo .txt b{font-weight:600; color:var(--t1)}
p.corpo+p.corpo{margin-top:20px}

blockquote{font-family:var(--face-ring); font-weight:400; font-size:50px; line-height:1.28;
           letter-spacing:.01em; color:var(--t1); max-width:900px}

.mono{font-family:var(--face-spec); font-weight:500; font-size:15px; line-height:1.9;
      letter-spacing:.12em; text-transform:uppercase; color:var(--t3); max-width:900px}

/* ---------- mosaico: duo e caixas ---------- */
.duo{display:grid; grid-template-columns:1fr 1fr; gap:var(--gutter)}
.tile{position:relative; padding:40px 36px 36px; background:var(--field-slab); color:var(--ink-full);
      --t1:var(--ink-full); --t2:var(--ink-mid); --t3:var(--ink-low)}
.tile.plate{background:none; color:var(--t1); outline:1px solid var(--r1); outline-offset:-1px}
.slide.campo-paper .tile.plate{--t1:var(--ink-onyx); --t2:var(--ink-onyx-mid); --t3:var(--ink-onyx-low)}
.tile .rot{color:var(--t2); margin-bottom:22px}
.duo .num{font-family:var(--face-display); font-weight:200; font-size:96px; line-height:.86;
          letter-spacing:-.035em; color:var(--t1); margin-bottom:22px; white-space:nowrap}
.duo .txt{font-size:23px; line-height:1.45; color:var(--t2)}
.tag{display:inline-block; margin-top:24px; padding:8px 12px 7px; font-size:14px}
.tag.ok{outline:1px solid var(--r2); outline-offset:-1px; color:var(--t1)}
.tag.alerta{background:var(--ink-full); color:var(--ink-onyx)}
.tile.plate .tag.alerta{background:var(--t1); color:var(--ink-onyx)}
.slide.campo-paper .tile.plate .tag.alerta{color:var(--ink-full)}

/* marcas de registro nos cantos — o Plate */
.tick{position:absolute; width:var(--tick); height:var(--tick); pointer-events:none; border:0 solid var(--r2)}
.tick.tl{top:16px; left:16px; border-top-width:1px; border-left-width:1px}
.tick.tr{top:16px; right:16px; border-top-width:1px; border-right-width:1px}
.tick.bl{bottom:16px; left:16px; border-bottom-width:1px; border-left-width:1px}
.tick.br{bottom:16px; right:16px; border-bottom-width:1px; border-right-width:1px}

.caixas{display:grid; gap:var(--gutter)}
.caixa p{font-size:24px; line-height:1.46; color:var(--t2)}
.caixa p+p{margin-top:12px}

/* ---------- numerada ---------- */
.item{display:grid; grid-template-columns:120px 1fr; gap:28px; align-items:start;
      border-top:1px solid var(--r1); padding-top:26px}
.item+.item{margin-top:30px}
.item .n{font-family:var(--face-display); font-weight:200; font-size:76px; line-height:.86;
         letter-spacing:-.035em; color:var(--t1)}
.item h2{font-family:var(--face-display); font-weight:300; font-size:36px; line-height:1.15;
         letter-spacing:-.01em; color:var(--t1); margin-bottom:10px}
.item p{font-size:23px; line-height:1.45; color:var(--t2)}

/* ---------- prazo ---------- */
.prazo{display:flex; gap:var(--gutter); height:84px}
.prazo i{flex:1}
.prazo i.viva{background:linear-gradient(180deg,#B4C0C7 0%,#536878 100%)}
.prazo i.morta{outline:1px solid var(--r1); outline-offset:-1px;
  background-image:repeating-linear-gradient(45deg,transparent 0 7px,var(--r1) 7px 8px)}
.prazo-rot{display:flex; justify-content:space-between; margin-top:16px; font-size:14px; color:var(--t2)}

/* ---------- selo ---------- */
.selo{position:relative; flex:0 0 auto}
.selo svg{display:block; position:absolute; inset:0}
.selo .marca{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; font-family:var(--face-ring); font-weight:500;
             letter-spacing:.02em; line-height:.82; color:var(--ink-full)}
/* capa e fecho: mesmo selo, 168px, 239px do topo */
.slide>.selo-placa{position:absolute; left:var(--pad); top:239px; z-index:1}

/* ---------- aviso do board de aplicação ---------- */
.aviso{color:var(--t2); margin-bottom:24px}

/* ---------- story 1080x1920 ---------- */
/* A moldura do Instagram cobre ~230px no topo e ~210px na base. O padding do
   story existe para manter manchete e microtipografia fora dessa faixa — não é
   respiro estético, é a área que o app não come. */
.slide.story{height:1920px; padding:250px var(--pad) 230px}
.slide.story>.selo-placa{top:413px}
.slide.story .miolo{padding:64px 0 48px}
.slide.story .caps{font-size:18px}
.slide.story h1{font-size:76px}
.slide.story h1.curta, .slide.story.fecho h1{font-size:100px}
.slide.story.capa h1{font-size:124px}
.slide.story p.corpo{font-size:30px; line-height:1.55}
.slide.story.capa p.corpo, .slide.story.fecho p.corpo{font-size:34px}
.slide.story blockquote{font-size:56px}
.slide.story .mono{font-size:17px}
.slide.story .duo .num{font-size:104px}
.slide.story .duo .txt{font-size:25px}
.slide.story .caixa p{font-size:27px}
.slide.story .item h2{font-size:40px}
.slide.story .item p{font-size:26px}
.slide.story .prazo{height:96px}
.slide.story .prazo-rot, .slide.story .tag{font-size:15px}
</style></head><body>
__SLIDES__
<script>
/* Selo: encaixa o texto no arco. Porta literal de design/obsidian-chrome/
   components/Seal/Seal.jsx — primeiro aperta o tracking até 0.08em, e só
   depois reduz o corpo. O build espera `window.__selos` antes da captura. */
(async () => {
  await document.fonts.ready;
  const BASE = 6.2, MIN = 0.08;
  for (const t of document.querySelectorAll('text[data-arco]')) {
    const med = t.previousElementSibling, arco = +t.dataset.arco, gap = +t.dataset.gap;
    const len = med.getComputedTextLength(), n = med.textContent.length;
    const glifos = len - n * gap * BASE;
    let fs = BASE, g = gap;
    if (len > arco) {
      const justo = glifos + n * MIN * BASE;
      if (justo <= arco) g = Math.max(MIN, (arco - glifos) / (n * BASE));
      else { g = MIN; fs = BASE * (arco / justo); }
    }
    t.style.fontSize = fs + 'px'; t.style.letterSpacing = g + 'em';
  }
  window.__selos = true;
})();
</script>
</body></html>
